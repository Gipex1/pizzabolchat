<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Общий чат</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #f9fafb; }
        main { width: min(720px, calc(100% - 28px)); height: min(760px, calc(100vh - 28px)); display: flex; flex-direction: column; gap: 14px; }
        header { display: flex; align-items: center; justify-content: space-between; }
        h1 { margin: 0; font-size: 1.5rem; }
        #status { color: #fbbf24; font-size: .9rem; }
        #messages { flex: 1; overflow-y: auto; padding: 16px; border: 1px solid #374151; border-radius: 12px; background: #1f2937; }
        .message { margin: 0 0 12px; overflow-wrap: anywhere; }
        .sender { color: #93c5fd; font-weight: 700; }
        .time { margin-left: 8px; color: #9ca3af; font-size: .75rem; }
        form { display: flex; gap: 8px; }
        input { min-width: 0; flex: 1; padding: 12px; border: 1px solid #4b5563; border-radius: 8px; background: #1f2937; color: inherit; }
        button { padding: 0 18px; border: 0; border-radius: 8px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .5; cursor: default; }
    </style>
</head>
<body>
<main>
    <header>
        <h1>Общий чат</h1>
        <span id="status">Подключаемся…</span>
    </header>
    <section id="messages" aria-live="polite" aria-label="Сообщения"></section>
    <form id="message-form">
        <input id="message-input" maxlength="500" autocomplete="off" placeholder="Напишите сообщение…" required>
        <button id="send-button" type="submit" disabled>Отправить</button>
    </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script src="app.js"></script>
</body>
</html>
